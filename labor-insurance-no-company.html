<h1>勞保一定要公司嗎？</h1>

<p>
很多人在離職或開始自由接案後，都會遇到一個問題：
沒有公司，還可以保勞保嗎？
</p>

<p>
其實，勞保是否能投保，取決於你的工作型態，
如果你是自由工作者、自營作業者或沒有固定雇主的人，
可以先了解是否符合職業工會的相關條件。
</p>
